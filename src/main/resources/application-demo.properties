spring.config.import=optional:file:./config/application-local-secrets.properties,optional:file:./config/application-demo-secrets.properties

server.address=0.0.0.0

spring.datasource.url=jdbc:postgresql://localhost:5432/guidemate_demo
spring.datasource.username=${DEMO_DB_USERNAME:ahmetkaragunlu}
spring.datasource.password=${DEMO_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

media.storage-root=${user.home}/.guidemate/guidemate-demo-media

auth.admin-seed.enabled=false
demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.dataset.enabled=${DEMO_DATASET_ENABLED:false}
demo.dataset.password=${DEMO_DATASET_PASSWORD:}
demo.dataset.reference-instant=${DEMO_REFERENCE_INSTANT:2026-08-28T12:00:00Z}
notification.fcm.enabled=${DEMO_FCM_ENABLED:false}

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
