spring.application.name=GuideMateBackend
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:2592000000}

google.client-id=${GOOGLE_CLIENT_ID}
app.public-base-url=${PUBLIC_BASE_URL}

media.storage-root=${MEDIA_STORAGE_ROOT}
media.max-file-size=5MB
media.orphan-grace-period=${MEDIA_ORPHAN_GRACE_PERIOD:PT24H}
media.cleanup-delay-ms=${MEDIA_CLEANUP_DELAY_MS:3600000}

tour.currency-code=USD
tour.lifecycle-delay-ms=${TOUR_LIFECYCLE_DELAY_MS:60000}

reservation.hold-duration=${RESERVATION_HOLD_DURATION:PT15M}

security.data-protection-key=${FINANCIAL_DATA_ENCRYPTION_KEY}

payment.canonical-currency-code=USD
payment.checkout-expiration=${PAYMENT_CHECKOUT_EXPIRATION:PT30M}
payment.callback-base-url=${PAYMENT_CALLBACK_BASE_URL:}
payment.fx.base-url=${FX_BASE_URL:https://api.frankfurter.dev}
payment.fx.quote-ttl=${FX_QUOTE_TTL:PT10M}
payment.fx.connect-timeout=${FX_CONNECT_TIMEOUT:PT3S}
payment.fx.read-timeout=${FX_READ_TIMEOUT:PT5S}
payment.fx.enabled-charge-currencies=${PAYMENT_CHARGE_CURRENCIES:USD,TRY,EUR,GBP}
payment.fx.rate-provider=${FX_RATE_PROVIDER:ECB}
payment.iyzico.api-key=${IYZICO_API_KEY}
payment.iyzico.secret-key=${IYZICO_SECRET_KEY}
payment.iyzico.base-url=${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
payment.payout-mode=${PAYOUT_MODE:SIMULATED}
payment.platform-commission-basis-points=${PLATFORM_COMMISSION_BASIS_POINTS:1000}
payment.sandbox-buyer.enabled=${IYZICO_SANDBOX_BUYER_ENABLED:true}
payment.sandbox-buyer.identity-number=${IYZICO_SANDBOX_IDENTITY_NUMBER:11111111111}
payment.sandbox-buyer.phone-number=${IYZICO_SANDBOX_PHONE_NUMBER:+905350000000}
payment.sandbox-buyer.address=${IYZICO_SANDBOX_ADDRESS:GuideMate Sandbox Address}
payment.sandbox-buyer.city=${IYZICO_SANDBOX_CITY:Istanbul}
payment.sandbox-buyer.country=${IYZICO_SANDBOX_COUNTRY:Turkey}
payment.sandbox-buyer.zip-code=${IYZICO_SANDBOX_ZIP_CODE:34000}
payment.sandbox-buyer.ip-address=${IYZICO_SANDBOX_IP_ADDRESS:127.0.0.1}

notification.fcm.enabled=${FCM_ENABLED:false}
notification.fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

scheduler.batch-size=${SCHEDULER_BATCH_SIZE:50}
scheduler.payment-retry-delay=${PAYMENT_RECONCILIATION_RETRY_DELAY:PT5M}
scheduler.payment-max-attempts=${PAYMENT_RECONCILIATION_MAX_ATTEMPTS:6}
scheduler.refund-retry-delay=${REFUND_RETRY_DELAY:PT15M}
scheduler.refund-max-attempts=${REFUND_MAX_ATTEMPTS:3}
scheduler.refund-processing-timeout=${REFUND_PROCESSING_TIMEOUT:PT30M}
scheduler.notification-retry-delay=${NOTIFICATION_RETRY_DELAY:PT5M}
scheduler.notification-max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
scheduler.reminder-lead-time=${UPCOMING_TOUR_REMINDER_LEAD_TIME:PT24H}
scheduler.device-inactive-after=${DEVICE_INACTIVE_AFTER:P30D}
scheduler.device-delete-after=${DEVICE_DELETE_AFTER:P90D}

scheduler.reservation-delay-ms=${RESERVATION_SCHEDULER_DELAY_MS:30000}
scheduler.payment-delay-ms=${PAYMENT_SCHEDULER_DELAY_MS:60000}
scheduler.refund-delay-ms=${REFUND_SCHEDULER_DELAY_MS:60000}
scheduler.earning-delay-ms=${EARNING_SCHEDULER_DELAY_MS:60000}
scheduler.notification-delay-ms=${NOTIFICATION_SCHEDULER_DELAY_MS:60000}
scheduler.reminder-delay-ms=${REMINDER_SCHEDULER_DELAY_MS:300000}
scheduler.device-cleanup-delay-ms=${DEVICE_CLEANUP_DELAY_MS:3600000}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

auth.rate-limit.login.max-failures=${AUTH_LOGIN_MAX_FAILURES:5}
auth.rate-limit.login.base-block-seconds=${AUTH_LOGIN_BASE_BLOCK_SECONDS:30}
auth.rate-limit.login.max-block-seconds=${AUTH_LOGIN_MAX_BLOCK_SECONDS:900}
auth.rate-limit.login.window-seconds=${AUTH_LOGIN_WINDOW_SECONDS:900}
auth.rate-limit.public.cooldown-seconds=${AUTH_PUBLIC_COOLDOWN_SECONDS:60}
auth.rate-limit.cleanup-ms=${AUTH_RATE_LIMIT_CLEANUP_MS:600000}

auth.admin-seed.enabled=${AUTH_ADMIN_SEED_ENABLED:false}
auth.admin-seed.email=${ADMIN_EMAIL:}
auth.admin-seed.password=${ADMIN_PASSWORD:}
auth.admin-seed.first-name=${ADMIN_FIRST_NAME:GuideMate}
auth.admin-seed.last-name=${ADMIN_LAST_NAME:Admin}

demo.seed.enabled=${DEMO_SEED_ENABLED:false}
demo.seed.password=${DEMO_SEED_PASSWORD:}
demo.seed.guide-email=${DEMO_GUIDE_EMAIL:guide.demo@guidemate.local}
demo.seed.tourist-email=${DEMO_TOURIST_EMAIL:tourist.demo@guidemate.local}

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.always-use-message-format=true

server.error.include-message=never
server.error.include-stacktrace=never
