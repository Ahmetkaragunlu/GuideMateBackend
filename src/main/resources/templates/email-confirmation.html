<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .success { background-color: #e8f5e9; color: #4caf50; }
        .failure { background-color: #ffebee; color: #d32f2f; }
        .icon { font-size: 40px; }
        h1 { color: #333; margin-bottom: 10px; font-size: 24px; }
        p { color: #666; line-height: 1.6; margin-bottom: 30px; }
        .footer-text { font-size: 12px; color: #999; margin-top: 20px; }
        @keyframes popIn {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon-circle" th:classappend="${success} ? 'success' : 'failure'">
        <span class="icon" th:text="${success} ? '&#10003;' : '!'"></span>
    </div>
    <h1 th:text="${title}"></h1>
    <p th:text="${message}"></p>
    <div class="footer-text" th:text="#{web.common.footer}"></div>
</div>
</body>
</html>
