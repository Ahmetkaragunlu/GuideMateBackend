<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}"></title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1); width: 90%; max-width: 380px; text-align: center; }
        h2 { color: #333; margin-bottom: 12px; }
        p { color: #666; line-height: 1.5; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; color: #666; font-size: 14px; font-weight: 600; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #4caf50; }
        input.invalid { border-color: #d32f2f; }
        .error-msg { color: #d32f2f; font-size: 12px; margin-top: 5px; display: none; }
        .btn { background-color: #4caf50; color: white; border: none; padding: 15px; width: 100%; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:disabled { background-color: #ccc; cursor: not-allowed; }
        #success-view { display: none; }
        .result-icon { width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .success { background: #e8f5e9; color: #4caf50; }
        .failure { background: #ffebee; color: #d32f2f; }
    </style>
</head>
<body>
<div class="card">
    <div id="form-view" th:if="${validToken}">
        <h2 th:text="${title}"></h2>
        <p th:text="${message}"></p>
        <input type="hidden" id="token" th:value="${token}">

        <div class="input-group">
            <label for="pass1" th:text="#{web.reset.form.newPassword.label}"></label>
            <input type="password" id="pass1" th:placeholder="#{web.reset.form.newPassword.placeholder}"
                   maxlength="64" inputmode="numeric" autocomplete="new-password">
            <div class="error-msg" id="err1" th:text="#{web.reset.form.newPassword.invalid}"></div>
        </div>

        <div class="input-group">
            <label for="pass2" th:text="#{web.reset.form.confirmPassword.label}"></label>
            <input type="password" id="pass2" th:placeholder="#{web.reset.form.confirmPassword.placeholder}"
                   maxlength="64" inputmode="numeric" autocomplete="new-password">
            <div class="error-msg" id="err2" th:text="#{web.reset.form.confirmPassword.mismatch}"></div>
        </div>

        <button class="btn" id="submitBtn" type="button" disabled
                th:text="#{web.reset.form.submit}"></button>
    </div>

    <div id="success-view">
        <div class="result-icon success">&#10003;</div>
        <h2 th:text="#{web.reset.form.success.title}"></h2>
        <p th:text="#{web.reset.form.success.message}"></p>
    </div>

    <div th:unless="${validToken}">
        <div class="result-icon failure">!</div>
        <h2 th:text="${title}"></h2>
        <p th:text="${message}"></p>
    </div>
</div>

<script th:if="${validToken}" th:inline="javascript">
    const pass1 = document.getElementById('pass1');
    const pass2 = document.getElementById('pass2');
    const button = document.getElementById('submitBtn');
    const token = document.getElementById('token').value;
    const submitText = /*[[#{web.reset.form.submit}]]*/ '';
    const submittingText = /*[[#{web.reset.form.submitting}]]*/ '';
    const updateErrorText = /*[[#{web.reset.form.error.update}]]*/ '';

    function normalizeNumericInput(event) {
        event.target.value = event.target.value.replace(/[^0-9]/g, '');
        validateForm();
    }

    function validateForm() {
        const validPassword = /^\d{8,64}$/.test(pass1.value);
        const passwordsMatch = pass1.value === pass2.value && pass2.value.length > 0;
        document.getElementById('err1').style.display =
            pass1.value.length > 0 && !validPassword ? 'block' : 'none';
        document.getElementById('err2').style.display =
            pass2.value.length > 0 && !passwordsMatch ? 'block' : 'none';
        pass1.classList.toggle('invalid', pass1.value.length > 0 && !validPassword);
        pass2.classList.toggle('invalid', pass2.value.length > 0 && !passwordsMatch);
        button.disabled = !(validPassword && passwordsMatch);
    }

    async function submitForm() {
        button.disabled = true;
        button.innerText = submittingText;
        try {
            const response = await fetch('/api/v1/auth/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    token: token,
                    newPassword: pass1.value,
                    confirmPassword: pass2.value
                })
            });
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.message || updateErrorText);
            }
            document.getElementById('form-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'block';
        } catch (error) {
            alert(error.message || updateErrorText);
            button.disabled = false;
            button.innerText = submitText;
        }
    }

    pass1.addEventListener('input', normalizeNumericInput);
    pass2.addEventListener('input', normalizeNumericInput);
    button.addEventListener('click', submitForm);
</script>
</body>
</html>
