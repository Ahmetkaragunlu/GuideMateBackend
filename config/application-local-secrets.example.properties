# Copy as config/application-local-secrets.properties and keep the real values out of Git.
JWT_SECRET=base64-encoded-secret-with-at-least-32-bytes
GOOGLE_CLIENT_ID=your-google-client-id
MAIL_USERNAME=your-mail-username
MAIL_PASSWORD=your-mail-password
PUBLIC_BASE_URL=http://your-mac-lan-ip:8080
IYZICO_API_KEY=your-iyzico-sandbox-api-key
IYZICO_SECRET_KEY=your-iyzico-sandbox-secret-key
FINANCIAL_DATA_ENCRYPTION_KEY=base64-encoded-32-byte-key
PAYMENT_CALLBACK_BASE_URL=https://your-public-https-tunnel.example
FCM_ENABLED=true
FCM_CREDENTIALS_PATH=./config/firebase-service-account.json

# Optional one-time controlled admin seed
AUTH_ADMIN_SEED_ENABLED=false
ADMIN_EMAIL=
ADMIN_PASSWORD=

# Optional idempotent local guide/tourist demo accounts
DEMO_SEED_ENABLED=false
DEMO_SEED_PASSWORD=
